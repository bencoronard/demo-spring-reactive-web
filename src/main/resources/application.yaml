server:
  address: "${SERVER_BIND_ADDRESS}"
  port: "${SERVER_BIND_PORT}"

management:
  server:
    port: "${SERVER_MANAGEMENT_PORT}"
    base-path: "${spring.webflux.base-path}"
  endpoint:
    health:
      group:
        readiness:
          include:
          - readinessState
          - s3Storage

spring:
  main:
    banner-mode: off
  web:
    error:
      whitelabel:
        enabled: false
  application:
    name: "${APP_NAME}"
  webflux:
    base-path: "${APP_CONTEXT_PATH}"
  profiles:
    active: "${APP_ENVIRONMENT}"

aws:
  s3:
    url: "${AWS_S3_URL}"
    bucket: "${AWS_S3_BUCKET}"
    health-check:
      timeout: "${AWS_S3_HEALTHCHECK_TIMEOUT_SEC}s"
      cache-ttl: "${AWS_S3_HEALTHCHECK_CACHE_TTL_SEC}s"
    storage:
      key:
        prefix: "${AWS_S3_STORAGE_KEY_PREFIX}"
        meta-owner: "${AWS_S3_STORAGE_KEY_META_OWNER}"
        meta-created-at: "${AWS_S3_STORAGE_KEY_META_CREATED_AT}"

storage:
  url: "${STORAGE_URL}"
  file:
    head:
      timeout: "${STORAGE_FILE_HEAD_TIMEOUT_SEC}s"
    delete:
      timeout: "${STORAGE_FILE_DELETE_TIMEOUT_SEC}s"
    download:
      timeout: "${STORAGE_FILE_DOWNLOAD_TIMEOUT_SEC}s"
      idle-timeout: "${STORAGE_FILE_DOWNLOAD_IDLE_TIMEOUT_SEC}s"
    upload:
      timeout: "${STORAGE_FILE_UPLOAD_TIMEOUT_SEC}s"
      idle-timeout: "${STORAGE_FILE_UPLOAD_IDLE_TIMEOUT_SEC}s"
      id-max-length: "${STORAGE_FILE_UPLOAD_MAX_ID_LENGTH_CHAR}"
      content-max-length: "${STORAGE_FILE_UPLOAD_MAX_CONTENT_LENGTH_BYTE}"
      content-types-allowed: "${STORAGE_FILE_UPLOAD_ALLOWED_CONTENT_TYPES}"
      content-groups-allowed: "${STORAGE_FILE_UPLOAD_ALLOWED_CONTENT_GROUPS}"

jwt:
  verify:
    key:
      uri: "${JWT_VERIFY_KEY_URI}"

---
spring:
  config:
    activate:
      on-profile: test
    import: classpath:.env.example[.properties]
